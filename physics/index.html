<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>係数を変えて動かす</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6feb'/%3E%3C/svg%3E">
  <style>
    :root {
      --lesson-bg: rgba(17, 20, 26, 0.9);
      --lesson-fg: #f3f1ec;
      --lesson-muted: #b9bec8;
      --lesson-card-bg: #ffffff;
      --lesson-card-fg: #1d222b;
      --lesson-card-muted: #5b6472;
      --lesson-accent: #1f6feb;
      --lesson-font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
      --page-bg: #26405a;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--page-bg);
      font-family: var(--lesson-font);
      touch-action: none;
      user-select: none;
    }
    #appbody { position: absolute; }

    /* Switch between the two pages of the playground. */
    #lesson-nav {
      position: fixed;
      z-index: 20;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 10px;
      background: var(--lesson-bg);
      font: 600 14px/1.2 var(--lesson-font);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }
    #lesson-nav a, #lesson-nav span {
      padding: 7px 12px;
      border-radius: 8px;
      color: var(--lesson-muted);
      text-decoration: none;
      white-space: nowrap;
    }
    #lesson-nav a:hover { color: var(--lesson-fg); background: rgba(255, 255, 255, 0.08); }
    #lesson-nav [aria-current="page"] { color: #fff; background: var(--lesson-accent); }

    #lesson, #readout {
      position: fixed;
      z-index: 10;
      left: 16px;
      max-width: 320px;
      margin: 0;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--lesson-card-fg);
      font: 400 14px/1.6 var(--lesson-font);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
    }
    #lesson { top: 68px; }
    #lesson p { margin: 0; }
    #readout {
      bottom: 16px;
      background: var(--lesson-bg);
      color: var(--lesson-fg);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    #readout[hidden], #paused[hidden], #loading[hidden] { display: none; }
    #paused {
      position: fixed;
      z-index: 10;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 8px;
      background: var(--lesson-bg);
      color: var(--lesson-fg);
      font: 600 14px/1.3 var(--lesson-font);
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lesson-fg);
      font: 15px/1.6 var(--lesson-font);
      text-align: center;
      padding: 16px;
    }

    #lesson-help {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.45);
    }
    #lesson-help[hidden] { display: none; }
    .lesson-card {
      max-width: 520px;
      width: 100%;
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 24px 28px;
      border-radius: 14px;
      background: var(--lesson-card-bg);
      color: var(--lesson-card-fg);
      font: 15px/1.7 var(--lesson-font);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      user-select: text;
    }
    .lesson-card h2 { margin: 0 0 12px; font-size: 20px; }
    .lesson-card ol { margin: 0 0 12px; padding-left: 1.4em; }
    .lesson-card li { margin-bottom: 6px; }
    .lesson-note { margin: 0 0 16px; font-size: 13px; color: var(--lesson-card-muted); }
    #lesson-help-close {
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--lesson-accent);
      border: 0;
      border-radius: 8px;
      padding: 8px 20px;
      cursor: pointer;
    }
    #lesson-help-open {
      font: inherit;
      font-size: 13px;
      color: var(--lesson-card-muted);
      background: none;
      border: 0;
      padding: 0;
      margin-top: 6px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #lesson-help-close:focus-visible, #lesson-help-open:focus-visible, #lesson-nav a:focus-visible {
      outline: 2px solid #9cc3ff;
      outline-offset: 2px;
    }

    /* lil-gui in the same light look as the robot page's panel. */
    .lil-gui {
      --background-color: #ffffff;
      --text-color: #1d222b;
      --title-background-color: #f1f3f5;
      --title-text-color: #1d222b;
      --widget-color: #e9ecef;
      --hover-color: #dee2e6;
      --focus-color: #ced4da;
      --number-color: #1f6feb;
      --string-color: #1d222b;
      --font-size: 13px;
      --input-font-size: 13px;
      --font-family: var(--lesson-font);
      --padding: 6px;
      --spacing: 6px;
      --widget-height: 24px;
      --title-height: 32px;
      --name-width: 42%;
    }
    .lil-gui.root {
      width: 320px;
      top: 16px !important;
      right: 16px !important;
      max-height: calc(100vh - 32px);
      overflow: auto;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
    }
    .lil-gui .title { font-weight: 600; }
    .lil-gui .lil-gui > .title { background: #f8f9fa; border-top: 1px solid #e9ecef; }

    @media (max-width: 640px) {
      #lesson { top: auto; bottom: 72px; max-width: calc(100vw - 32px); box-sizing: border-box; }
      #readout { max-width: calc(100vw - 32px); box-sizing: border-box; }
      .lil-gui.root { width: min(300px, calc(100vw - 32px)); top: 64px !important; max-height: 45vh; }
    }
  </style>
</head>
<body>
  <nav id="lesson-nav" aria-label="ページの切り替え">
    <a href="../">ロボットで試す</a>
    <span aria-current="page">係数を変える</span>
  </nav>
  <div id="lesson">
    <p id="lesson-text">右のパネルでシーンを選び、スライダを動かす。</p>
    <button type="button" id="lesson-help-open">遊び方</button>
  </div>
  <div id="readout" aria-live="polite" hidden></div>
  <div id="paused" hidden>一時停止中（Space で再開）</div>
  <div id="loading">シミュレータを読み込んでいる。数秒から十数秒かかる。</div>

  <div id="lesson-help" role="dialog" aria-labelledby="lesson-help-title" hidden>
    <div class="lesson-card">
      <h2 id="lesson-help-title">遊び方</h2>
      <ol>
        <li>右のパネルの「シーン」で、斜面の箱などの実験を選ぶ。</li>
        <li>「実験」のスライダで値を変える。値を変えると、初めから動き直す。</li>
        <li>左下の数字で、何が変わったかを確かめる。</li>
        <li>物体はドラッグで引っ張れる。引っ張る力は、シミュレータの中にしかない力。</li>
      </ol>
      <p class="lesson-note">物体のない所をドラッグすると視点が回る。ホイールで寄る。Space で一時停止、Backspace で最初から。</p>
      <button type="button" id="lesson-help-close">始める</button>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.js" } }
  </script>
  <script>
    (function () {
      var help = document.getElementById("lesson-help");
      var SEEN = "pasp-physics-help-seen";
      function openHelp() { help.hidden = false; document.getElementById("lesson-help-close").focus(); }
      function closeHelp() {
        help.hidden = true;
        try { window.localStorage.setItem(SEEN, "1"); } catch (e) {}
      }
      document.getElementById("lesson-help-open").addEventListener("click", openHelp);
      document.getElementById("lesson-help-close").addEventListener("click", closeHelp);
      help.addEventListener("click", function (ev) { if (ev.target === help) closeHelp(); });
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && !help.hidden) closeHelp();
      });
      var seen = false;
      try { seen = window.localStorage.getItem(SEEN) === "1"; } catch (e) {}
      if (!seen && !/[?&]help=0(&|$)/.test(window.location.search)) openHelp();

      // Keep ?help=0 on the link back, so a checked-off card stays closed there too.
      var back = document.querySelector('#lesson-nav a');
      if (/[?&]help=0(&|$)/.test(window.location.search)) back.href = "../?help=0";

      var loading = document.getElementById("loading");
      var timer = window.setInterval(function () {
        if (window.__physicsReady) { loading.hidden = true; window.clearInterval(timer); }
      }, 200);
      window.addEventListener("error", function () {
        if (!window.__physicsReady) {
          loading.textContent = "読み込めなかった。ページを再読み込みする。直らなければ講師に知らせる。";
        }
      });
    })();
  </script>
  <div id="appbody">
    <script type="module" src="./src/main.js"></script>
  </div>
</body>
</html>
